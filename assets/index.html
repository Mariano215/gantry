<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Gantry console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f3870'/%3E%3Cpath d='M11.6 5.2A3.8 3.8 0 1 0 12 8.6H8.2' fill='none' stroke='%23006bdb' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<header class="topbar">
  <a class="brand" href="#/overview">
    <span class="brand-mark" role="img" aria-label="Gantry"></span>
    <span class="brand-text">gantry</span>
  </a>

  <nav class="nav" id="nav" aria-label="Views">
    <a href="#/overview" data-view="overview">Overview<kbd>1</kbd></a>
    <a href="#/ledger" data-view="ledger">Ledger<kbd>2</kbd></a>
    <a href="#/run" data-view="run">Run<kbd>3</kbd></a>
    <a href="#/trace" data-view="trace">Trace<kbd>4</kbd></a>
    <a href="#/policy" data-view="policy">Policy<kbd>5</kbd></a>
    <a href="#/trust" data-view="trust">Trust<kbd>6</kbd></a>
    <a href="#/inbox" data-view="inbox">Inbox<kbd>7</kbd></a>
    <a href="#/verify" data-view="verify">Verify<kbd>8</kbd></a>
  </nav>

  <div class="topbar-right">
    <a class="chip" id="head-chip" href="#/verify" title="Latest signed tree head">
      <span class="chip-key">head</span>
      <span class="chip-val mono" id="head-chip-val">…</span>
    </a>
    <button class="chip chip-btn" id="theme-btn" type="button" title="Theme: auto, dark, light (t)">
      <span class="chip-key">theme</span>
      <span class="chip-val" id="theme-btn-val">auto</span>
    </button>
  </div>
</header>

<!-- The verification takeover. A ledger that fails verification renders here
     and nothing else renders until the reader dismisses it deliberately. -->
<div id="takeover" hidden></div>

<!-- Stays for the whole session once a takeover is dismissed. Not a badge. -->
<div id="alertbar" hidden></div>

<main id="view" tabindex="-1"></main>

<footer class="keyhints">
  <span><kbd>/</kbd> filter</span>
  <span><kbd>j</kbd><kbd>k</kbd> move</span>
  <span><kbd>Enter</kbd> expand</span>
  <span><kbd>Esc</kbd> collapse</span>
  <span><kbd>1</kbd> to <kbd>8</kbd> views</span>
  <span><kbd>t</kbd> theme</span>
  <span class="keyhints-note">read-only console, it reports what the server found and never verifies anything itself</span>
</footer>

<script type="module" src="/app.js"></script>
</body>
</html>
