w10 rect{animation:t10 20.45s infinite linear}@keyframes t10{0%,43.521%{transform:scaleX(0)}51.051%,100%{transform:scaleX(1)}}.r11{animation:a11 20.45s infinite}@keyframes a11{0%,52.763%{opacity:0}52.772999999999996%,100%{opacity:1}}.r12{animation:a12 20.45s infinite}@keyframes a12{0%,53.007%{opacity:0}53.016999999999996%,100%{opacity:1}}.r13{animation:a13 20.45s infinite}@keyframes a13{0%,53.252%{opacity:0}53.262%,100%{opacity:1}}.r14{animation:a14 20.45s infinite}@keyframes a14{0%,53.496%{opacity:0}53.506%,100%{opacity:1}}.r15{animation:a15 20.45s infinite}@keyframes a15{0%,60.587%{opacity:0}60.597%,100%{opacity:1}}.r16{animation:a16 20.45s infinite}@keyframes a16{0%,64.499%{opacity:0}64.509%,100%{opacity:1}}#w16 rect{animation:t16 20.45s infinite linear}@keyframes t16{0%,64.499%{transform:scaleX(0)}72.372%,100%{transform:scaleX(1)}}.r17{animation:a17 20.45s infinite}@keyframes a17{0%,74.083%{opacity:0}74.093%,100%{opacity:1}}.r18{animation:a18 20.45s infinite}@keyframes a18{0%,74.328%{opacity:0}74.33800000000001%,100%{opacity:1}}.r19{animation:a19 20.45s infinite}@keyframes a19{0%,74.572%{opacity:0}74.58200000000001%,100%{opacity:1}}.r20{animation:a20 20.45s infinite}@keyframes a20{0%,74.817%{opacity:0}74.827%,100%{opacity:1}}.r21{animation:a21 20.45s infinite}@keyframes a21{0%,75.061%{opacity:0}75.07100000000001%,100%{opacity:1}}.r22{animation:a22 20.45s infinite}@keyframes a22{0%,75.306%{opacity:0}75.316%,100%{opacity:1}}.r23{animation:a23 20.45s infinite}@keyframes a23{0%,75.55%{opacity:0}75.56%,100%{opacity:1}}.r24{animation:a24 20.45s infinite}@keyframes a24{0%,75.795%{opacity:0}75.805%,100%{opacity:1}}.r25{animation:a25 20.45s infinite}@keyframes a25{0%,76.039%{opacity:0}76.049%,100%{opacity:1}}.r26{animation:a26 20.45s infinite}@keyframes a26{0%,76.284%{opacity:0}76.29400000000001%,100%{opacity:1}}.r27{animation:a27 20.45s infinite}@keyframes a27{0%,76.528%{opacity:0}76.53800000000001%,100%{opacity:1}}.r28{animation:a28 20.45s infinite}@keyframes a28{0%,76.773%{opacity:0}76.783%,100%{opacity:1}}.r29{animation:a29 20.45s infinite}@keyframes a29{0%,77.017%{opacity:0}77.027%,100%{opacity:1}}.r30{animation:a30 20.45s infinite}@keyframes a30{0%,77.262%{opacity:0}77.272%,100%{opacity:1}}.r31{animation:a31 20.45s infinite}@keyframes a31{0%,77.506%{opacity:0}77.516%,100%{opacity:1}}.r32{animation:a32 20.45s infinite}@keyframes a32{0%,77.751%{opacity:0}77.76100000000001%,100%{opacity:1}}.r33{animation:a33 20.45s infinite}@keyframes a33{0%,77.995%{opacity:0}78.00500000000001%,100%{opacity:1}}.r34{animation:a34 20.45s infinite}@keyframes a34{0%,78.24%{opacity:0}78.25%,100%{opacity:1}}</style><g opacity="1"><clipPath id="w0" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="46" width="327.6" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r0" x="16" y="59" fill="#3b90ff">$</text><g clip-path="url(#w0)"><text class="r0" x="31.6" y="59" fill="#e3e9f4" textLength="327.6" lengthAdjust="spacingAndGlyphs">gantry ledger init /tmp/gantry-cast/ledger</text></g><text class="r1" x="16" y="78" fill="#e3e9f4" textLength="351.0" lengthAdjust="spacingAndGlyphs">ledger initialised at /tmp/gantry-cast/ledger</text><text class="r2" x="16" y="97" fill="#64748f" textLength="351.0" lengthAdjust="spacingAndGlyphs"># ask the broker to run something destructive</text><clipPath id="w3" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="103" width="452.4" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r3" x="16" y="116" fill="#3b90ff">$</text><g clip-path="url(#w3)"><text class="r3" x="31.6" y="116" fill="#e3e9f4" textLength="452.4" lengthAdjust="spacingAndGlyphs">gantry broker call /tmp/gantry-cast/ledger Bash "rm -rf /"</text></g><text class="r4" x="16" y="135" fill="#ff5f5a" textLength="694.2" lengthAdjust="spacingAndGlyphs">policy denied Bash on rm -rf /: rule r-destructive-shell fired and the decision is on the</text><text class="r5" x="16" y="154" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">ledger. Fix: This command is destructive and its capability's rollback handle cannot recall</text><text class="r6" x="16" y="173" fill="#e3e9f4" textLength="663.0" lengthAdjust="spacingAndGlyphs">it. Scope the deletion to a path the run owns, or route it through a capability whose</text><text class="r7" x="16" y="192" fill="#e3e9f4" textLength="226.2" lengthAdjust="spacingAndGlyphs">rollback genuinely covers it.</text><text class="r8" x="16" y="211" fill="#e3e9f4" textLength="327.6" lengthAdjust="spacingAndGlyphs">refusal recorded (ledger sealed at size 8)</text><text class="r9" x="16" y="230" fill="#64748f" textLength="522.6" lengthAdjust="spacingAndGlyphs"># the record is checkable without trusting the binary that wrote it</text><clipPath id="w10" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="236" width="343.2" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r10" x="16" y="249" fill="#3b90ff">$</text><g clip-path="url(#w10)"><text class="r10" x="31.6" y="249" fill="#e3e9f4" textLength="343.2" lengthAdjust="spacingAndGlyphs">gantry ledger verify /tmp/gantry-cast/ledger</text></g><text class="r11" x="16" y="268" fill="#e3e9f4" textLength="78.0" lengthAdjust="spacingAndGlyphs">entries: 8</text><text class="r12" x="16" y="287" fill="#e3e9f4" textLength="429.0" lengthAdjust="spacingAndGlyphs">attestations verified against config/actor-keys.json: 8</text><text class="r13" x="16" y="306" fill="#e3e9f4" textLength="702.0" lengthAdjust="spacingAndGlyphs">of those, 8 were signed under a key whose seed is published, so they prove which run wrote</text><text class="r14" x="16" y="325" fill="#e3e9f4" textLength="686.4" lengthAdjust="spacingAndGlyphs">the event and not who operated it; a deployment registers its own key and keeps the seed</text><text class="r15" x="16" y="344" fill="#64748f" textLength="452.4" lengthAdjust="spacingAndGlyphs"># now copy the ledger and alter one character of one event</text><clipPath id="w16" clipPathUnits="userSpaceOnUse"><rect x="31.6" y="350" width="358.8" height="19" style="transform-origin:31.6px 0px"/></clipPath><text class="r16" x="16" y="363" fill="#3b90ff">$</text><g clip-path="url(#w16)"><text class="r16" x="31.6" y="363" fill="#e3e9f4" textLength="358.8" lengthAdjust="spacingAndGlyphs">gantry ledger verify /tmp/gantry-cast/tampered</text></g><text class="r17" x="16" y="382" fill="#e3e9f4" textLength="78.0" lengthAdjust="spacingAndGlyphs">entries: 8</text><text class="r18" x="16" y="401" fill="#e3e9f4" textLength="429.0" lengthAdjust="spacingAndGlyphs">attestations verified against config/actor-keys.json: 7</text><text class="r19" x="16" y="420" fill="#e3e9f4" textLength="702.0" lengthAdjust="spacingAndGlyphs">of those, 7 were signed under a key whose seed is published, so they prove which run wrote</text><text class="r20" x="16" y="439" fill="#e3e9f4" textLength="686.4" lengthAdjust="spacingAndGlyphs">the event and not who operated it; a deployment registers its own key and keeps the seed</text><text class="r21" x="16" y="458" fill="#ff3b40" textLength="702.0" lengthAdjust="spacingAndGlyphs">entry 4 (run-1785945668923-4): chain diverges between entry 4 and entry 5: entry 5 records</text><text class="r22" x="16" y="477" fill="#e3e9f4" textLength="702.0" lengthAdjust="spacingAndGlyphs">prev_hash Some("sha256:3dcf380e4777ba372dc1f2236f191ec7e60b32cf49e617574c197bfc2860f289"),</text><text class="r23" x="16" y="496" fill="#e3e9f4" textLength="265.2" lengthAdjust="spacingAndGlyphs">recomputed leaf hash of entry 4 is</text><text class="r24" x="16" y="515" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">Some("sha256:e56afb0d0f1beabf2d5cc976b6859885a26522a817e129a9479680e31b9eb5c3"). Fix: entry</text><text class="r25" x="16" y="534" fill="#e3e9f4" textLength="413.4" lengthAdjust="spacingAndGlyphs">4 was altered after append; restore it from a replica</text><text class="r26" x="16" y="553" fill="#ff3b40" textLength="655.2" lengthAdjust="spacingAndGlyphs">entry 4 (run-1785945668923-4): Merkle root diverges first at tree size 5: recomputed</text><text class="r27" x="16" y="572" fill="#e3e9f4" textLength="694.2" lengthAdjust="spacingAndGlyphs">sha256:dace0680ea6e547f526dc83f0ec0ea98ccefc8c01a9398e477bead5ec49ec6fe, signed head says</text><text class="r28" x="16" y="591" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">sha256:de971632fc885817a28d96e16519c074842ed33bd6c838431ae47df8525f39a2. Newest entry under</text><text class="r29" x="16" y="610" fill="#e3e9f4" textLength="670.8" lengthAdjust="spacingAndGlyphs">that head is entry 4 (id run-1785945668923-4). Fix: restore entry 4 from a replica and</text><text class="r30" x="16" y="629" fill="#e3e9f4" textLength="70.2" lengthAdjust="spacingAndGlyphs">re-verify</text><text class="r31" x="16" y="648" fill="#ff3b40" textLength="717.6" lengthAdjust="spacingAndGlyphs">entry 4 (run-1785945668923-4): entry 4 (id run-1785945668923-4) carries an attestation under</text><text class="r32" x="16" y="667" fill="#e3e9f4" textLength="709.8" lengthAdjust="spacingAndGlyphs">registered key ed25519:407d778d0d4ca380 that does not verify. Fix: the envelope was altered</text><text class="r33" x="16" y="686" fill="#e3e9f4" textLength="717.6" lengthAdjust="spacingAndGlyphs">after signing, or the attestation was forged; restore the entry from a replica or revoke the</text><text class="r34" x="16" y="705" fill="#e3e9f4" textLength="23.4" lengthAdjust="spacingAndGlyphs">key</text></g></svg>
